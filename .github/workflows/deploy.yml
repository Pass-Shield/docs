name: deploy docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: set up pytong
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: install mkdocs
        run: pip install mkdocs-material

      - name: build and deploy to gh-pages branch
        run: mkdocs gh-deploy --force
