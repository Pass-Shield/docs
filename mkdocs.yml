site_name: Passssshield
site_url: https://pass-shield.github.io/docs/

theme:
  name: material
  palette:
    scheme: slate

nav:
  - Overview: index.md
  - Cryptography: crypto.md
  - Services:
    - Audit:
      - Use Cases: modules/audit/use-cases.md

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
